<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Favicon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@1,6..72,300&family=Spline+Sans+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #080a0a; color: #e6e9e7; font: 17px/1.5 system-ui, sans-serif; }
  .page { max-width: 1180px; margin: 0 auto; padding: 32px 16px 80px; }
  .page > h1 { font-size: 26px; margin: 0 0 4px; font-weight: 600; }
  .page > p { margin: 0 0 32px; color: #9aa4a0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 28px; }
  .card { cursor: pointer; padding: 16px; border-radius: 8px; background: #0e1211; border: 1px solid #1d2422; }
  .card.selected { outline: 3px solid #e6e9e7; outline-offset: 3px; }
  .card h3 { margin: 0 0 2px; font-size: 18px; }
  .card p { margin: 0 0 14px; font-size: 14px; color: #9aa4a0; }
  .big { width: 100%; aspect-ratio: 1; image-rendering: pixelated; display: block; border-radius: 4px;
    background: repeating-conic-gradient(#151a19 0 25%, #101413 0 50%) 0 0 / 32px 32px; }
  .sizes { display: flex; gap: 16px; align-items: end; margin: 14px 0; font: 12px 'Spline Sans Mono', monospace; color: #8d897e; }
  .sizes figure { margin: 0; display: grid; gap: 4px; justify-items: center; }
  .sizes img { image-rendering: pixelated; }
  .tab { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px 8px 0 0; font: 13px system-ui, sans-serif; width: 190px; }
  .tab.dark { background: #35363a; color: #e8eaed; }
  .tab.light { background: #ffffff; color: #202124; margin-top: 6px; box-shadow: 0 0 0 1px #dadce0; }
  .tabs { display: grid; gap: 0; }
  .strip { padding: 8px 10px 0; border-radius: 6px; }
  .strip.dark { background: #202124; }
  .strip.light { background: #dee1e6; margin-top: 8px; }
</style>
</head>
<body>
<div class="page">
  <h1>Favicon, pixel art from the real equations</h1>
  <p>Each icon is a short RK4 trajectory of the actual system, a few loops long, projected onto a 16 × 16 grid. Below each one, the icon at real size and in a dark and a light browser tab. Click one and tell me in the terminal.</p>
  <div class="grid" id="grid"></div>
</div>
<script>
const PAL = [[0, [30, 46, 120]], [0.35, [48, 140, 172]], [0.62, [120, 204, 196]], [0.84, [240, 196, 112]], [1, [255, 246, 228]]];
const palette = t => {
  t = Math.min(1, Math.max(0, t));
  for (let i = 1; i < PAL.length; i++) {
    const [s0, c0] = PAL[i - 1], [s1, c1] = PAL[i];
    if (t <= s1) { const a = (t - s0) / (s1 - s0); return c0.map((c, k) => Math.round(c + (c1[k] - c) * a)); }
  }
  return PAL[PAL.length - 1][1];
};
const GOLD = [232, 200, 138], GOLD_DIM = [150, 124, 80], INK = [236, 230, 214], TILE = [11, 13, 12];

const SYSTEMS = {
  lorenz: { d: ([x, y, z]) => [10 * (y - x), x * (28 - z) - y, x * y - (8 / 3) * z], p0: [1, 1, 1], dt: 0.004, proj: ([x, , z]) => [x, -z] },
  halvorsen: { d: ([x, y, z]) => [-1.4 * x - 4 * y - 4 * z - y * y, -1.4 * y - 4 * z - 4 * x - z * z, -1.4 * z - 4 * x - 4 * y - x * x], p0: [1, 0, 0], dt: 0.004,
    proj: ([x, y, z]) => [(x - y) / Math.SQRT2, -(x + y - 2 * z) / Math.sqrt(6)] },
  aizawa: { d: ([x, y, z]) => [(z - 0.7) * x - 3.5 * y, 3.5 * x + (z - 0.7) * y, 0.6 + 0.95 * z - z ** 3 / 3 - (x * x + y * y) * (1 + 0.25 * z) + 0.1 * z * x ** 3], p0: [0.1, 0, 0], dt: 0.005,
    proj: ([x, , z]) => [x, -z] },
  aizawaTop: { d: (p) => SYSTEMS.aizawa.d(p), p0: [0.1, 0, 0], dt: 0.005, proj: ([x, y]) => [x, y] },
};

function trace(sys, steps = 300000, skip = 3000) {
  let p = sys.p0.slice();
  const add = (a, b, s) => a.map((v, i) => v + b[i] * s);
  const pts = [];
  for (let i = 0; i < steps + skip; i++) {
    const k1 = sys.d(p), k2 = sys.d(add(p, k1, sys.dt / 2)), k3 = sys.d(add(p, k2, sys.dt / 2)), k4 = sys.d(add(p, k3, sys.dt));
    p = p.map((v, j) => v + (sys.dt / 6) * (k1[j] + 2 * k2[j] + 2 * k3[j] + k4[j]));
    if (i >= skip) pts.push([sys.proj(p), Math.hypot(...k1)]);
  }
  return pts;
}

function raster(pts, size, pad) {
  let u0 = Infinity, u1 = -Infinity, v0 = Infinity, v1 = -Infinity;
  for (const [[u, v]] of pts) { u0 = Math.min(u0, u); u1 = Math.max(u1, u); v0 = Math.min(v0, v); v1 = Math.max(v1, v); }
  const span = Math.max(u1 - u0, v1 - v0), inner = size - 2 * pad;
  const ou = pad + (inner - (u1 - u0) / span * inner) / 2, ov = pad + (inner - (v1 - v0) / span * inner) / 2;
  const count = new Float32Array(size * size), speed = new Float32Array(size * size);
  for (const [[u, v], s] of pts) {
    const i = Math.min(size - 1, Math.floor(ou + (u - u0) / span * inner)), j = Math.min(size - 1, Math.floor(ov + (v - v0) / span * inner));
    count[j * size + i]++; speed[j * size + i] += s;
  }
  const lit = [...count].filter(c => c > 0).sort((a, b) => a - b);
  const q = f => lit[Math.floor(f * (lit.length - 1))];
  const sp = [...count].map((c, k) => (c ? speed[k] / c : 0)).filter(Boolean).sort((a, b) => a - b);
  return { count, avg: k => (count[k] ? speed[k] / count[k] : 0), q, sq: f => sp[Math.floor(f * (sp.length - 1))] };
}

function draw(size, variant) {
  const pad = variant.tile ? Math.max(2, size / 8) : 1;
  const r = raster(variant.pts, size, pad);
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'), img = g.createImageData(size, size);
  const lo = variant.cut < 0 ? 0 : r.q(variant.cut), hi = r.q(0.8), slo = r.sq(0.05), shi = r.sq(0.95);
  for (let k = 0; k < size * size; k++) {
    let col = null;
    if (variant.tile) {
      const x = k % size, y = Math.floor(k / size), e = size - 1, corner = (x === 0 || x === e) && (y === 0 || y === e);
      if (!corner) col = TILE;
    }
    if (r.count[k] > lo) {
      if (variant.mode === 'gold') col = r.count[k] > hi ? GOLD : GOLD_DIM;
      else if (variant.mode === 'ink') col = r.count[k] > hi ? INK : GOLD;
      else col = palette((variant.floor ?? 0) + (1 - (variant.floor ?? 0)) * (r.avg(k) - slo) / (shi - slo));
    }
    if (col) { img.data.set([...col, 255], k * 4); }
  }
  g.putImageData(img, 0, 0);
  return c.toDataURL();
}

const VARIANTS = [
  { id: 'lorenz-gold', name: 'Lorenz, gold', note: 'A few loops of the butterfly in two tones of the accent gold, on a dark tile.', sys: 'lorenz', steps: 1500, mode: 'gold', tile: true, cut: -1 },
  { id: 'lorenz-speed', name: 'Lorenz, speed colours', note: 'The same loops coloured by speed with the shader palette.', sys: 'lorenz', steps: 1500, mode: 'speed', tile: true, cut: -1 },
  { id: 'lorenz-speed-tuned', name: 'Lorenz, speed colours, tuned', note: 'Palette starts at teal, so the slowest pixels stay visible on the dark tile.', sys: 'lorenz', steps: 1500, mode: 'speed', tile: true, cut: -1, floor: 0.35 },
  { id: 'halvorsen', name: 'Halvorsen, three lobes', note: 'Viewed along its axis of symmetry, ivory and gold.', sys: 'halvorsen', steps: 1500, mode: 'ink', tile: true, cut: -1 },
  { id: 'aizawa', name: 'Aizawa, from above', note: 'The spiral seen from the top, in gold.', sys: 'aizawaTop', steps: 3000, mode: 'gold', tile: true, cut: -1 },
];

const grid = document.getElementById('grid');
const cache = {};
for (const v of VARIANTS) {
  v.pts = trace(SYSTEMS[v.sys], v.steps, 3000);
  const s16 = draw(16, v), s32 = draw(32, v);
  const card = document.createElement('div');
  card.className = 'card'; card.dataset.choice = v.id; 
  card.innerHTML = `<h3>${v.name}</h3><p>${v.note}</p>
    <img class="big" src="${s16}" alt="">
    <div class="sizes"><figure><img src="${s16}" width="16" height="16" alt=""><figcaption>16</figcaption></figure>
      <figure><img src="${s32}" width="32" height="32" alt=""><figcaption>32</figcaption></figure>
      <figure><img src="${s32}" width="64" height="64" alt=""><figcaption>32 at 2×</figcaption></figure></div>
    <div class="strip dark"><div class="tab dark"><img src="${s16}" width="16" height="16" alt="">Attractors</div></div>
    <div class="strip light"><div class="tab light" style="margin-top:0"><img src="${s16}" width="16" height="16" alt="">Attractors</div></div>`;
  grid.appendChild(card);
}
</script>
</body>
</html>
