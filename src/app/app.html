<canvas #canvas class="main" [class.shifted]="onStatistics()"></canvas>
@if (store.phase() !== 'start') {
  @if (host.error(); as message) {
    <p class="error">{{ message }}</p>
  }
}
@if (store.phase() === 'view') {
  @if (!store.uiHidden() || onStatistics()) {
    <app-top-bar />
  }
  <router-outlet />
}
