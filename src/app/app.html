<canvas
  #canvas
  class="main"
  [class.shifted]="onStatistics()"
  [class.concealed]="store.phase() === 'start' && !intro.leaving()"
></canvas>
@if (store.phase() === 'start') {
  <app-start-screen [leaving]="intro.leaving()" />
}
@if (store.phase() !== 'start') {
  @if (host.error(); as message) {
    <p class="error">{{ message }}</p>
  }
}
@if (store.phase() === 'select') {
  <app-system-ring />
}
@if (store.phase() === 'view') {
  @if (!store.uiHidden() || onStatistics()) {
    <app-top-bar />
  }
  <router-outlet />
}
